services:
  pulseboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4500:4500"
    environment:
      PULSEBOARD_HOST: 0.0.0.0
      PULSEBOARD_DB_PATH: /data/pulseboard.db
      # Forward captured webhooks to your app (use the compose service name):
      PULSEBOARD_FORWARD: http://your-app:3000
      # PULSEBOARD_READONLY: "true"
      # PULSEBOARD_AUTH_PASSWORD: changeme
    volumes:
      - pulseboard-data:/data

volumes:
  pulseboard-data:
