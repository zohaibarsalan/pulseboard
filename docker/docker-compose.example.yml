services:
  webhook-studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4500:4500"
    environment:
      WEBHOOK_STUDIO_HOST: 0.0.0.0
      WEBHOOK_STUDIO_DB_PATH: /data/webhook-studio.db
      # Forward captured webhooks to your app (use the compose service name):
      WEBHOOK_STUDIO_FORWARD: http://your-app:3000
      # WEBHOOK_STUDIO_READONLY: "true"
      # WEBHOOK_STUDIO_AUTH_PASSWORD: changeme
    volumes:
      - webhook-studio-data:/data

volumes:
  webhook-studio-data:
